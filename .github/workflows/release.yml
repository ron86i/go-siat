name: Release Please

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Versión a publicar, por ejemplo 2.4.2"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: go
          release-as: ${{ inputs.release_version }}
